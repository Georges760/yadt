[package]
name = "yadt"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
# blit is not published, so it is pinned to a commit. Both crates come from the same
# workspace and must move together.
blit = { git = "https://github.com/nicoburniske/blit", rev = "1235e1775bae56686f3d0170b1dfab3ffff7f0cc" }
blit-tui = { git = "https://github.com/nicoburniske/blit", rev = "1235e1775bae56686f3d0170b1dfab3ffff7f0cc" }
clap = { version = "4.6", features = ["derive"] }
# Only for reading the terminal size before blit takes the terminal over.
rustix = { version = "1", features = ["termios"] }
similar = { version = "3.2", features = ["inline", "unicode"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
